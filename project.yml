# XcodeGen spec. Run `xcodegen generate` to create BudgetLog.xcodeproj.
name: BudgetLog
options:
  bundleIdPrefix: com.crystalge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BudgetLog:
    type: application
    platform: iOS
    sources: [BudgetLog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crystalge.budgetlog
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  BudgetLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BudgetLogTests]
    dependencies:
      - target: BudgetLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BudgetLog:
    build:
      targets:
        BudgetLog: all
    run:
      config: Debug
    test:
      targets: [BudgetLogTests]
